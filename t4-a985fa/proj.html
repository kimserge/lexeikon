<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#14161c);--card:light-dark(#f5f6f9,#1c1f27);--ink:light-dark(#16181d,#e9ebf0);--mut:light-dark(#5b6170,#a2a8b6);--line:light-dark(#dfe2e8,#343845);--band:light-dark(#152a6b,#0f1d4b);--bandink:#fff;--lap:light-dark(#1f3fbf,#8ab0ff);--rub:light-dark(#b0281f,#ff8a7a);--ok:light-dark(#1d7a3c,#7fd69a);
 --lex:'Noto Serif','Noto Serif Georgian','Noto Serif Armenian','Noto Naskh Arabic','Noto Sans Syriac','Noto Sans Ethiopic','Noto Sans Coptic',serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Noto Sans',sans-serif}
.top{background:var(--band);color:var(--bandink);padding:22px max(5vw,16px) 18px}
.top .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top h1{margin:0;font:700 26px/1.15 'Noto Serif',serif;flex:1 1 auto}.top h1 a{color:inherit;text-decoration:none}
.top .sub{opacity:.85;margin-top:6px;font-size:14px}
.tnav{display:flex;gap:4px 18px;flex-wrap:wrap;margin-top:12px}.tnav a{color:#fff;opacity:.8;text-decoration:none;font-weight:600;font-size:14px;padding:4px 0;border-bottom:2px solid transparent}.tnav a:hover{opacity:1}.tnav a.on{opacity:1;border-bottom-color:#fff}
select,input,textarea,button{font:inherit;color:inherit}
.uil{background:rgb(255 255 255/.15);color:#fff;border:1px solid rgb(255 255 255/.5);border-radius:10px;padding:4px 8px}.uil option{color:#000}
main{max-width:1200px;margin:0 auto;padding:20px max(5vw,16px) 80px}
h2{font:700 22px/1.2 'Noto Serif',serif;margin:24px 0 12px}h3{font:700 17px/1.2 'Noto Serif',serif;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=email],input[type=password],textarea,select.f{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--mut) 65%,transparent)}
input:focus,textarea:focus,select.f:focus{outline:2px solid var(--lap);outline-offset:0;border-color:transparent}
textarea{min-height:60px;resize:vertical}
.btn{cursor:pointer;border:1.5px solid var(--lap);background:transparent;color:var(--lap);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.pri{background:var(--lap);color:var(--bg)}.btn:disabled{opacity:.4;cursor:default}
.lnk{all:unset;cursor:pointer;color:var(--mut);font-size:13px;text-decoration:underline;text-underline-offset:3px}.lnk.red{color:var(--rub)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{flex:1}
.list{list-style:none;padding:0;margin:0}.list li{display:flex;gap:10px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list li:hover{background:var(--card)}.list .nm{flex:1;font-weight:600}.meta{color:var(--mut);font-size:13px}
.sg{font:italic 600 14px 'Noto Sans',sans-serif;color:var(--lap)}
.lx{font-family:var(--lex);font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.g2 .full{grid-column:1/-1}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 12px}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
@media(min-width:1000px){.side .g2{grid-template-columns:1fr 1fr 1.15fr 1.15fr}.side .g2 .full{order:5}#ed .side label{margin-top:6px}#ed .side{padding:4px 12px 10px;margin-top:10px}#ed input[type=text]{padding:8px 12px}#ed h2{margin-bottom:4px}}
.side{border:1px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin-top:12px;background:var(--bg)}
.side.b{border-style:dashed}
.side .gh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}
.side .gh h3{font-size:15px;color:var(--mut);font-family:'Noto Sans',sans-serif;font-weight:600}
.fld{position:relative}.fld input{padding-right:46px}
.kbb{position:absolute;right:6px;bottom:6px;width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.kbb.on{color:var(--lap);border-color:var(--lap)}
.fld input[dir=rtl]{padding-right:12px;padding-left:46px}.fld input[dir=rtl]+.kbb{right:auto;left:6px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;min-height:6px;max-height:76px;overflow-y:auto;padding:1px;scrollbar-width:thin}.sugs .meta{padding:2px 0}
.sugs button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:4px 9px;text-align:start;max-width:100%}
.sugs button b{font:400 17px var(--lex)}.sugs button span{color:var(--mut);font-size:12px;margin-inline-start:6px}
.sugs button.on{border-color:var(--lap);outline:1px solid var(--lap)}.sugs .lt{font-size:11px;color:var(--lap);margin-inline-start:6px;font-style:italic}
.msg{margin-top:10px;font-size:14px}.msg.err{color:var(--rub)}.msg.ok{color:var(--ok)}
.pill{font-size:12px;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--mut)}.pill.new{border-color:var(--rub);color:var(--rub)}.pill.ok{border-color:var(--ok);color:var(--ok)}
.ov{position:fixed;inset:0;background:rgb(0 0 0/.35);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:3vh 8px 40vh;z-index:9}
.ov[hidden]{display:none}.ov>.card{max-width:min(1180px,96vw);width:100%;background:var(--bg);box-shadow:0 20px 50px rgb(0 0 0/.25);position:relative}
a{color:var(--lap)}.hidden{display:none!important}
.head2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.head2 h2{flex:1}
.prev{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:14px}
.vsg{font-style:italic;color:var(--rub)}.vsg.w{color:#ffd9d2}.delp{margin-left:auto;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--rub);border-radius:8px;padding:3px 5px;font:400 11px 'Noto Sans',sans-serif;opacity:.85}.delp:hover{opacity:1}.delp svg{width:14px;height:14px}.delp .vsg{font-weight:600}.head2 h2 .pill{font:400 12px 'Noto Sans',sans-serif;vertical-align:middle;margin-left:8px;white-space:nowrap}.delp:hover{border-color:var(--rub)}
.trash{position:absolute;right:14px;bottom:14px;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center}
.trash:hover{color:var(--rub);border-color:var(--rub)}
/* cards table */
.ct{width:100%;border-collapse:collapse;margin-top:12px}
.ct th{font:600 12px 'Noto Sans',sans-serif;color:var(--mut);text-align:start;padding:6px 8px;border-bottom:1.5px solid var(--line);line-height:2}
.ct th.r{text-align:end}.ct th button{all:unset;cursor:pointer;padding:2px 6px;border-radius:6px;color:var(--lap)}.ct th button.on{background:color-mix(in srgb,var(--lap) 14%,transparent)}
.ct td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;cursor:pointer;font:18px/1.35 var(--lex)}
.ct tr:hover td{background:var(--card)}.ct .ar{text-align:end}.ct .lm{color:var(--mut)}.ct .x{color:var(--mut);font:14px 'Noto Sans',sans-serif}

.kb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1180px,100vw);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);border-bottom:0;background:var(--card);border-radius:14px 14px 0 0;z-index:12;box-shadow:0 -8px 30px rgb(0 0 0/.18)}
.kb .kh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:6px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.keys button{min-height:36px;padding:0;font:19px/1 var(--lex);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}

.keys.forms{margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.keys.dia button{font-size:22px}

  const cell=(x,r)=>`<span dir="${r?'rtl':'ltr'}">${esc(x.f)}${x.l&&x.l!==x.f?` <span class="x">${ar(r)}</span> <span class="lm">${esc(x.l)}</span>`:''}</span>`;
  $('#clist').innerHTML=rows.map(k=>{const d=cdata(k.data);return `<tr data-c="${k.id}"><td>${cell(d.a,rA)}</td><td class="${rB?'ar':''}">${d.b.map(x=>cell(x,rB)).join('<br>')}</td></tr>`}).join('');
  {const did='u-'+auth.nick+'-'+(cur.slug||''),r0=rows.length?cdata(rows[0].data):null,fw=!r0?'':sortK[0]==='b'?((r0.b[0]||{}).f||r0.a.f||''):(r0.a.f||'');$('#viewB').href='./?only='+encodeURIComponent(did)+(fw?'&q='+encodeURIComponent(fw):'');$('#viewB').classList.toggle('hidden',!cards.length);const sg=`<span class="vsg">${esc(cur.sig||cur.name)}</span>`;$('#viewB').innerHTML=esc(I.view).replace('{d}',sg);$('#publish').innerHTML=esc(I.publish).replace('{d}',`<span class="vsg w">${esc(cur.sig||cur.name)}</span>`);$('#delL').innerHTML=esc(I.delp).replace('{d}',sg)}
  $('#ctab').classList.toggle('hidden',!cards.length);$('#cEmpty').classList.toggle('hidden',cards.length>0)}
$('#ctab').onclick=e=>{const s=e.target.closest('[data-s]');if(s){sortK=s.dataset.s;ls.set('lexp_sort',sortK);renderProj();return}const tr=e.target.closest('[data-c]');if(tr)openCard(cards.find(k=>k.id===+tr.dataset.c))};
$('#back').onclick=e=>{e.preventDefault();go('#')};
$('#editProj').onclick=()=>go('#edit'+cur.id);
$('#delProj').onclick=async()=>{if(!confirm('«'+cur.name+'» — '+I.sure))return;try{await api('/projects/'+cur.id,{method:'DELETE'});cur=null;go('#',1)}catch(e){$('#pMsg').className='msg err';$('#pMsg').textContent=e.message}};
$('#publish').onclick=async()=>{$('#publish').disabled=true;$('#pMsg').className='msg';$('#pMsg').textContent='…';
  try{const j=await api('/projects/'+cur.id+'/publish',{method:'POST'});cur.pushed=j.pushed;cur.status='pending';cur.anote='';$('#pMsg').className='msg ok';$('#pMsg').textContent=j.mailed?I.sent:I.sentNoMail;renderProj()}
  catch(e){$('#pMsg').className='msg err';$('#pMsg').textContent=e.message}finally{$('#publish').disabled=false}};

/* ---- lemma suggestions ---- */
const gk=s=>String(s||'').normalize('NFD').replace(/\p{M}/gu,'').toLowerCase().replace(/ς/g,'σ').replace(/[^α-ω]/g,'');
const nk=s=>String(s||'').normalize('NFD').replace(/[\p{M}ـ̀-ͯ]/gu,'').toLowerCase().replace(/[\s\-‐()·.,;]/g,'');
const arK=s=>String(s||'').replace(/[ً-ْٰـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ء/g,'');
const cache={};const getJ=(u,t)=>cache[u]||(cache[u]=fetch(u).then(r=>r.ok?(t?r.text():r.json()):null).catch(()=>null));
async function hwIdx(L){const u=L==='grc'?'../data/mlhw.json':'../data/hw/'+L+'.json';const k='hw:'+L;if(!cache[k])cache[k]=getJ(u).then(a=>{a=a||[];const m=new Map();a.forEach(x=>{if(!m.has(x[0]))m.set(x[0],x[1])});return {a,keys:a.map(x=>L==='grc'?gk(x[0]):L==='ar'?arK(x[0]):nk(x[0])),m}});return cache[k]}
async function grcLem(w){const k=gk(w);if(!k)return [];const t=await getJ('../data/lem/grc/'+k.slice(0,3)+'.txt',1);if(!t)return [];
  const suf=k.slice(3),line=t.split('\n').find(l=>l.slice(0,l.indexOf('\t'))===suf);if(!line)return [];
  const L=(await getJ('../data/lem/grc/_lemmata.txt',1)||'').split('\n');return line.split('\t')[1].split(',').map(i=>L[+i]).filter(Boolean)}
const AP=['وال','فال','بال','كال','ولل','لل','ال','و','ف','ب','ك','ل','س'],AS=['هما','كما','ات','ون','ين','ان','ية','ها','هم','هن','كم','كن','نا','وا','تم','تن','ه','ك','ي','ة','ت','ن','ا'];
async function arLem(w){const A=await getJ('../data/lem/ar.json');if(!A)return [];const k=arK(w),out=[],seen=new Set();
  const tryK=(s,sc)=>{for(const x of [s,s+'ه',s.replace(/ت$/,'ه')]){const r=A.w[x];if(r)r.forEach(([l,rt])=>{const id=l+'|'+rt;if(!seen.has(id)){seen.add(id);out.push({l,rt,v:A.r[rt]||'',sc})}})}};
  const pre=[''],suf=[''];for(const p of AP)if(k.startsWith(p)&&k.length-p.length>=2)pre.push(p);for(const s of AS)if(k.endsWith(s)&&k.length-s.length>=2)suf.push(s);
  for(const p of pre)for(const s of suf){const st=k.slice(p.length,k.length-s.length);if(st.length>=2)tryK(st,st.length)}
  out.sort((a,b)=>b.sc-a.sc);return out.slice(0,8)}
async function suggest(i){const S=i===-1?edCard.a:edCard.b[i],L=i===-1?pLa(cur):pLb(cur),box=document.querySelector(`.sugs[data-i="${i}"]`);if(!box)return;
  const f=S.f.trim(),l=S.l.trim(),items=[];
  if(!f&&!l){box.innerHTML=`<span class="meta">${esc(I.nolem)}</span>`;return}
  const H=await hwIdx(L),gl=w=>H.m.get(w)||'';
  if(f&&(!S._typing)){
    const ws=f.split(/\s+/).filter(Boolean);
    if(L==='grc')for(const w of ws)for(const x of await grcLem(w))items.push({w:x,g:gl(x)});
    if(L==='la'){const lf=await getJ('../data/latforms.json');for(const w of ws){const k=w.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');for(const x of (lf&&lf[k])||[])items.push({w:x,g:gl(x)});if(H.m.has(k))items.push({w:k,g:gl(k)})}}
    if(L==='ar')for(const w of ws)for(const x of await arLem(w)){items.push({w:x.l,g:gl(x.l)||(x.rt?I.root+' '+x.rt:'')});if(x.v&&x.v!==x.l)items.push({w:x.v,g:I.rootv+(x.rt?' · '+x.rt:''),t:1})}
  }
  if(L==='grc')items.sort((a,b)=>(b.g?1:0)-(a.g?1:0));
  if(!items.length||S._typing&&l){const kf=L==='grc'?gk:L==='ar'?arK:nk,q=kf(S._typing&&l?l:f.split(/\s+/)[0]);if(q){
    const lcp=(a,b)=>{let n=0;while(n<a.length&&n<b.length&&a[n]===b[n])n++;return n};const sc=[],typed=S._typing&&l;
    for(let j=0;j<H.keys.length;j++){const kk=H.keys[j];if(typed){if(kk.startsWith(q))sc.push([kk.length,j])}else{const n=lcp(q,kk);if(n>=Math.min(3,q.length))sc.push([-(n*10)+Math.abs(kk.length-n),j])}}
    sc.sort((a,b)=>a[0]-b[0]);for(const[,j] of sc.slice(0,12))items.push({w:H.a[j][0],g:H.a[j][1]})}}
  const seen=new Set(),u=items.filter(x=>!seen.has(x.w)&&seen.add(x.w)).slice(0,14);
  box.innerHTML=u.map(x=>`<button type="button" data-l="${esc(x.w)}" class="${x.w===l?'on':''}"><b dir="auto">${esc(x.w)}</b>${x.g?`<span>${esc(x.g)}</span>`:''}</button>`).join('')||'<span class="meta">—</span>'}

/* ---- card editor ---- */
const kbIco='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 10h1M9.5 10h1M13 10h1M16.5 10h1M7 14h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
function sideHtml(S,i){const L=i===-1?pLa(cur):pLb(cur),dir=RTL.has(L)?'rtl':'ltr',k=KEYS[L]?`<button type="button" class="kbb" data-kb="${L}" title="${esc(I.kbd)}" aria-label="${esc(I.kbd)}">${kbIco}</button>`:'';
  const inp=(f,lab,x)=>`<div class="${x||''}"><label>${esc(lab)}</label><div class="fld"><input type="text" data-f="${f}" lang="${L}" dir="${f==='f'||f==='l'?dir:'auto'}" value="${esc(S[f])}" autocomplete="off" spellcheck="false" ${f==='s'?`placeholder="${esc(I.srcPh)}"`:''}>${f==='f'||f==='l'?k:''}</div></div>`;
  return `<div class="side ${i===-1?'a':'b'}" data-i="${i}"><div class="gh"><h3>${esc(lname(L))}${i>=0?' · '+esc(I.equiv)+' '+(i+1):''}</h3>${i>=0&&edCard.b.length>1?`<button type="button" class="lnk red" data-rm="${i}">×</button>`:''}</div>
   <div class="g2">${inp('f',I.form)}${inp('l',I.lemma)}<div class="full"><div class="sugs" data-i="${i}"></div></div>${inp('s',I.src)}${inp('t',I.tr+' ('+(TLN[cur.tl]||cur.tl)+')')}</div></div>`}
function renderSides(){if(!edCard.b.length)edCard.b.push({f:'',l:'',s:'',t:''});$('#sides').innerHTML=sideHtml(edCard.a,-1)+edCard.b.map((b,i)=>sideHtml(b,i)).join('');$('#addB').disabled=edCard.b.length>=3;suggest(-1);edCard.b.forEach((_,i)=>suggest(i))}
const sideOf=el=>{const s=el.closest('[data-i]');if(!s)return null;const i=+s.dataset.i;return [i,i===-1?edCard.a:edCard.b[i]]};
let sT=null;
$('#sides').addEventListener('input',e=>{const f=e.target.dataset.f,so=sideOf(e.target);if(!f||!so)return;const[i,S]=so;S[f]=e.target.value;if(f==='f'||f==='l'){S._typing=f==='l';clearTimeout(sT);sT=setTimeout(()=>suggest(i),180)}});
$('#sides').addEventListener('focusin',e=>{if(e.target.matches('input[data-f]')){kbT=e.target;if(!$('#kb').hidden&&KEYS[e.target.lang]&&(e.target.dataset.f==='f'||e.target.dataset.f==='l')){kbL=e.target.lang;renderKb()}}});
$('#sides').addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(b){const so=sideOf(b);so[1].l=b.dataset.l;so[1]._typing=false;b.closest('.side').querySelector('[data-f=l]').value=b.dataset.l;suggest(so[0]);return}
  const r=e.target.closest('[data-rm]');if(r){edCard.b.splice(+r.dataset.rm,1);renderSides();return}
  const k=e.target.closest('[data-kb]');if(k){const inp=k.parentNode.querySelector('input');kbT=inp;if(!$('#kb').hidden&&kbL===k.dataset.kb){$('#kb').hidden=true;markKb();return}kbL=k.dataset.kb;gezBase=null;$('#kb').hidden=false;renderKb();inp.focus({preventScroll:true});kbScroll()}});
function kbScroll(){requestAnimationFrame(()=>{if(!kbT)return;const r=kbT.getBoundingClientRect(),kh=$('#kb').getBoundingClientRect().top;if(r.bottom>kh-60||r.top<0)$('#ed').scrollBy({top:r.bottom-(kh-90),behavior:'smooth'})})}
$('#addB').onclick=()=>{if(edCard.b.length<3){edCard.b.push({f:'',l:'',s:'',t:''});renderSides();$('#sides').lastElementChild.querySelector('input').focus()}};
function openCard(c){const d=cdata(c?c.data:null);edCard={id:c?c.id:null,a:{...{f:'',l:'',s:'',t:''},...d.a},b:(d.b||[]).map(x=>({...{f:'',l:'',s:'',t:''},...x}))};
  $('#edMsg').textContent='';$('#edDel').classList.toggle('hidden',!c);$('#kb').hidden=true;renderSides();$('#ed').hidden=false;$('#ed').scrollTop=0;$('#sides').querySelector('input').focus()}
$('#addCard').onclick=()=>openCard(null);
async function closeCard(){const cl=x=>({f:(x.f||'').trim(),l:(x.l||'').trim(),s:(x.s||'').trim(),t:(x.t||'').trim()}),d={a:cl(edCard.a),b:edCard.b.map(cl).filter(x=>x.f||x.l||x.s||x.t)};
  if(!edCard.id&&!d.a.f&&!d.a.l&&!d.b.length){$('#ed').hidden=true;return}
  $('#edMsg').className='msg';$('#edMsg').textContent=I.saving;
  try{const k=edCard.id?await api(`/projects/${cur.id}/cards/${edCard.id}`,{method:'PUT',body:d}):await api(`/projects/${cur.id}/cards`,{method:'POST',body:d});
    const i=cards.findIndex(x=>x.id===k.id);if(i>=0)cards[i]=k;else cards.push(k);cur.updated=new Date().toISOString();cur.n=cards.length;$('#ed').hidden=true;renderProj()}
  catch(e){$('#edMsg').className='msg err';$('#edMsg').textContent=e.message}}
$('#edClose').onclick=closeCard;
$('#ed').onclick=e=>{if(e.target.id==='ed')closeCard()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ed').hidden)closeCard()});
$('#edDel').onclick=async()=>{if(!confirm(I.surec))return;try{await api(`/projects/${cur.id}/cards/${edCard.id}`,{method:'DELETE'});cards=cards.filter(k=>k.id!==edCard.id);cur.updated=new Date().toISOString();cur.n=cards.length;$('#ed').hidden=true;renderProj()}catch(e){$('#edMsg').className='msg err';$('#edMsg').textContent=e.message}};

/* ---- on-screen keyboard ---- */
let kbT=null,kbL='grc',gezBase=null;
function markKb(){document.querySelectorAll('.kbb').forEach(b=>b.classList.toggle('on',!$('#kb').hidden&&b.dataset.kb===kbL&&b.parentNode.querySelector('input')===kbT))}
function renderKb(){const k=$('#kb');if(k.hidden)return;let h=`<div class="kh"><span>${esc(I.kbd)} · ${esc(lname(kbL))}</span><button type="button" class="lnk" data-kx="1">${esc(I.kbClose)}</button></div>`;
  if(kbL==='gez'&&gezBase!=null)h+=`<div class="keys forms">${[0,1,2,3,4,5,6,7].map(o=>`<button data-c="${String.fromCharCode(gezBase+o)}">${String.fromCharCode(gezBase+o)}</button>`).join('')}</div>`;
  if(DIA[kbL])h+=`<div class="keys forms dia">${DIA[kbL].map(c=>`<button data-c="${c}">◌${c}</button>`).join('')}</div>`;
  h+=`<div class="keys">${KEYS[kbL].split(' ').map(c=>`<button ${kbL==='gez'?'data-g':'data-c'}="${c}">${c}</button>`).join('')}<button class="fn" data-c=" ">${esc(I.space)}</button><button class="fn" data-bs="1">⌫</button></div>`;
  k.innerHTML=h;k.dir=RTL.has(kbL)?'rtl':'ltr';markKb()}
function kbInput(){kbT.dispatchEvent(new Event('input',{bubbles:true}))}
function insert(c){const q=kbT;if(!q)return;const a=q.selectionStart??q.value.length,b=q.selectionEnd??a;q.value=(q.value.slice(0,a)+c+q.value.slice(b)).normalize('NFC');const p=Math.min(q.value.length,a+c.length);q.setSelectionRange(p,p);kbInput()}
function backspace(){const q=kbT;if(!q)return;const a=q.selectionStart??q.value.length,b=q.selectionEnd??a;if(a!==b){q.value=q.value.slice(0,a)+q.value.slice(b);q.setSelectionRange(a,a)}else if(a>0){const s=[...q.value.slice(0,a)];s.pop();const p=s.join('');q.value=p+q.value.slice(a);q.setSelectionRange(p.length,p.length)}kbInput()}
$('#kb').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
$('#kb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.kx){$('#kb').hidden=true;markKb();return}
  if(b.dataset.g){const x=b.dataset.g.charCodeAt(0);if(gezBase===x)insert(b.dataset.g);gezBase=x;renderKb();return}
  if(b.dataset.bs){backspace();return}
  if(b.dataset.c!=null){if(DIA[kbL]&&DIA[kbL].includes(b.dataset.c)){const q=kbT,a=q.selectionStart??q.value.length,pre=q.value.slice(0,a).normalize('NFD');q.value=(pre+b.dataset.c).normalize('NFC')+q.value.slice(a);const p=(pre+b.dataset.c).normalize('NFC').length;q.setSelectionRange(p,p);kbInput()}else insert(b.dataset.c)}});
/* ---- start ---- */
function go(h,replace){if(h==='#')h=location.pathname+location.search;if(replace)history.replaceState(null,'',h);else history.pushState(null,'',h);route()}
async function route(){if(!auth){show('auth');return}const h=location.hash;
  if(h==='#new'){openForm(null);return}
  let m=h.match(/^#(p|edit)(\d+)$/);if(m){if(!projs.length)try{projs=await api('/projects')}catch(e){}const p=projs.find(x=>x.id===+m[2]);if(!p){go('#',1);return}if(m[1]==='edit')openForm(p);else openProj(p.id);return}
  cur=null;await loadList();if(h==='#profile'){openProfile();show('list')}}
addEventListener('popstate',route);
setMode(false);i18n();route();
</script>
