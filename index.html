<style>
/* VOICE: scholarly, quiet, exact — a reading-room tool.
   IDEA: a rubricated lexicon page: headwords in vermilion, glosses in ink.
   PICTURE: the working search and its results; a band of letters from seven scripts.
   COLOUR and TYPE: lapis band, white page, vermilion rubric; Noto Serif + script Notos, Noto Sans for UI.
   LAYOUT: search and results first; library column beside on wide screens, below on phones. */
:root{--sat:env(safe-area-inset-top,0px);color-scheme:light dark;
--bg:light-dark(#ffffff,#111317);--ink:light-dark(#17191e,#e8e6e1);--mut:light-dark(#5b606a,#9ba1ab);
--line:light-dark(#e2e4e9,#2a2e36);--card:light-dark(#f5f6f8,#1a1d23);--rub:light-dark(#b02a1f,#ff8d7d);
--lap:light-dark(#1d3a9e,#a9bcff);--band:light-dark(#13265c,#0c1838);--bandink:#f3f1ea;
--lex:'Noto Serif','Noto Sans Syriac','Noto Serif Georgian','Noto Serif Armenian','Noto Serif Ethiopic','Noto Sans Coptic','Noto Naskh Arabic',serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans',system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,4vw,48px) max(5vw,16px)}
.scroll{overflow-x:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{background:var(--band);color:var(--bandink);padding-bottom:18px;padding-top:calc(clamp(22px,4vw,48px) + var(--sat))}
.hrow{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.tgrow{display:flex;align-items:center;gap:10px}
.uil{font:600 14px 'Noto Sans',sans-serif;min-height:40px;padding:0 6px;border-radius:10px;border:1px solid rgb(255 255 255/.5);background:rgb(255 255 255/.12);color:var(--bandink);flex:0 0 auto;cursor:pointer}
body.cmp .hrow{flex-direction:row;align-items:center;gap:12px}body.cmp .uil{min-height:36px}
.uil option{color:#17191e}
body.cmp .top{position:sticky;top:0;z-index:8;padding-top:calc(10px + var(--sat));padding-bottom:10px}
body.cmp .qsticky{position:sticky;top:var(--hh,106px);z-index:7;background:var(--bg);margin:calc(-1*clamp(18px,3vw,36px)) calc(-1*max(5vw,16px)) 0;padding:10px max(5vw,16px);box-shadow:0 6px 12px -8px rgb(0 0 0/.25)}
@media(min-width:900px){body.cmp .qsticky{margin-right:0;padding-right:0}}
body.cmp .top .tg,body.cmp .top .sub,body.cmp .top .sub2,body.cmp .top .credit{display:none}
body.cmp .top h1{font-size:24px}
body.cmp .tin{flex-wrap:nowrap;align-items:center}
body.cmp .lgb{margin-top:8px}
body.cmp .lgb button{height:44px}
.sub2{margin:6px 0 0;font-size:14px;opacity:.82;max-width:62ch}
.credit{margin:8px 0 0;font-size:13px;opacity:.7;max-width:62ch}
.foot{background:var(--card);border-top:1px solid var(--line);margin-top:20px;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;line-height:1.45}
.fin{max-width:1240px;margin:auto}
.foot h2{font:700 14px/1.2 'Noto Serif',serif;margin:0 0 8px}
.foot h3{font:600 12px 'Noto Sans',sans-serif;margin:12px 0 4px;color:var(--mut)}
.cr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:0}
.cr dt{color:var(--mut);font-size:12px}
.cr dd{margin:0}
.foot a{color:var(--lap)}
.src{margin:0;padding-inline-start:1.1em;font-size:12px;color:var(--mut)}
.src li{margin:3px 0}
.yrs{margin:10px 0 0;font-size:11px;color:var(--mut);display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.upd{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid var(--lap);border-radius:999px;background:var(--bg);color:var(--lap);font:600 11px 'Noto Sans',sans-serif;cursor:pointer}
.upd:active{background:var(--lap);color:var(--bg)}
.upd.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.tin{max-width:1240px;margin:auto;display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font:700 clamp(32px,5vw,48px)/1.05 'Noto Serif',serif;margin:0;text-wrap:balance}
.tg{font:400 clamp(17px,2.4vw,22px)/1.3 'Noto Serif',serif;opacity:.85}
.sub{margin:8px 0 0;opacity:.88;max-width:62ch}
.sub b{font-weight:600}.sub i{font-family:'Noto Serif',serif}.sub .sc{font-family:var(--lex);font-size:1.1em}
.lgb{max-width:1240px;width:100%;min-width:0;margin:18px auto 0;display:flex;flex-wrap:nowrap;gap:8px;align-items:center}
.lgb button{flex:0 1 56px;min-width:0;height:60px;border-radius:14px;border:1px solid rgb(255 255 255/.55);background:rgb(255 255 255/.16);color:var(--bandink);cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:opacity .15s,background .15s}
.lgb button .s{font:400 24px/1 var(--lex)}
.lgb button .a{font:600 10.5px/1 'Noto Sans',sans-serif;letter-spacing:.02em;opacity:.85;max-width:100%;overflow:hidden;white-space:nowrap}
.lgb button:hover{background:rgb(255 255 255/.28)}
.lgb button.off{background:transparent;border-style:dashed;opacity:.4}
.lgb .lgn{flex:1 1 auto;min-width:0;font:14px/1.3 'Noto Sans',sans-serif;opacity:.8;margin-inline-start:4px}
.lgb button:focus-visible{outline:2px solid var(--bandink);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--lap);background:var(--lap);color:var(--bg);font:600 15px 'Noto Sans',sans-serif;cursor:pointer}
.btn.light{background:var(--bandink);color:#13265c;border-color:var(--bandink)}
.btn.ghost{background:transparent;color:var(--lap)}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--rub);outline-offset:2px}
.sug{position:fixed;right:0;z-index:8;width:50vw;margin:0;padding:4px;list-style:none;background:var(--bg);border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:0 8px 18px rgb(0 0 0/.14);overflow:auto;overscroll-behavior:contain}
.sug li{padding:4px 8px;border-radius:6px;cursor:pointer}.sug li.act,.sug li:hover{background:var(--card)}
.sug .w{font:700 16px/1.25 var(--lex);color:var(--rub);overflow-wrap:anywhere}.sug .tr{margin:0 0 0 6px;font-size:12px}.sug .m{display:block;font-size:11px;line-height:1.25;color:var(--mut);overflow-wrap:anywhere}
@media(max-width:899px){body.sugo #res,body.sugo #more{margin-inline-end:calc(50vw - max(5vw,16px) + 8px)}}
@media(min-width:900px){.sug{border-radius:0 10px 10px 0}}
.wrap{max-width:1240px;margin:auto;padding:clamp(18px,3vw,36px) max(5vw,16px) 60px;display:grid;gap:36px}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1fr) 330px}}
.qrow{display:flex;gap:10px}
.qtools{display:flex;flex-wrap:nowrap;gap:clamp(4px,1.5vw,8px);margin-bottom:8px;align-items:center}
#kbB,#clr{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 clamp(5px,2.4vw,18px);font-size:clamp(12px,3.6vw,15px)}
.syms{flex:0 1 auto;min-width:0}
.syms{display:inline-flex;gap:6px}
.syms button{width:clamp(28px,9vw,44px);min-height:44px;padding:0;border:1px solid var(--lap);border-radius:10px;background:transparent;color:var(--lap);font:400 24px/1 'Noto Serif','Noto Sans',serif;cursor:pointer}
.syms button.md{font-size:40px;line-height:0;padding-top:.42em}
.syms button:active{background:var(--lap);color:var(--bg)}
#clr{margin-inline-start:auto}
#kbB[aria-expanded="true"]{background:var(--rub);border-color:var(--rub);color:var(--bg)}
#q{flex:1;font:400 22px/1.3 var(--lex);padding:12px 16px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-height:56px}
.chips,.opts{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;align-items:center}
.chips button,.seg button{min-height:40px;padding:0 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:15px 'Noto Sans',sans-serif;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:32px;padding:0 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--lap);color:var(--bg)}
.chk{display:inline-flex;gap:8px;align-items:center;min-height:40px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--lap)}.opts{flex-wrap:nowrap;gap:4px 8px}.opts .seg{flex:0 1 auto;min-width:0}.opts .seg button{padding:0 clamp(4px,1.7vw,10px);font-size:clamp(11px,3.2vw,13px);white-space:nowrap}.opts .chk{flex:1 1 0;min-width:0;gap:6px;min-height:32px;font-size:clamp(10.5px,2.9vw,12px);line-height:1.15;overflow-wrap:anywhere}.opts .chk input{flex:none;width:18px;height:18px}@media(max-width:340px){.opts{gap:4px}.opts .chk{gap:4px;font-size:10px}.opts .chk input{width:16px;height:16px}.opts .seg button{padding:0 3px}}
.kb{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.kb .kl{display:flex;flex-wrap:nowrap;gap:4px;margin-bottom:10px;direction:ltr}
.kb .kl button{flex:1 1 auto;min-width:0;white-space:nowrap;min-height:34px;padding:0 3px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mut);cursor:pointer;font-size:clamp(11px,3vw,13px)}
.kb .kl button.on{color:var(--ink);border-color:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.keys.forms{display:flex;flex-wrap:wrap}.keys.forms button{min-width:44px}
.keys button{min-width:0;min-height:44px;padding:0;font:22px/1 var(--lex);border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.keys button.fn{font:13px 'Noto Sans',sans-serif;padding:0 4px;color:var(--mut);white-space:nowrap;overflow:hidden}
.bsi{display:inline-block;font-size:16px;line-height:1}.kb[dir=rtl] .bsi{transform:scaleX(-1)}
.keys.forms{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.qbox{position:relative;flex:1}
#q{width:100%}
#q::-webkit-search-cancel-button{display:none}
.how{margin-top:10px}
.cheat{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 12px;align-items:baseline;font-size:14px;margin:4px 0 6px}
.cheat .k{font:700 18px 'Noto Sans',sans-serif;color:var(--rub);text-align:center;min-width:1.4em}
.cheat .v{color:var(--mut);font-family:'Noto Serif',serif;white-space:nowrap}
.cheat .s{font-size:13px}.cheat .s b{font:400 17px var(--lex);color:var(--ink)}
.tr{font:italic 400 16px 'Noto Serif',serif;color:var(--mut);margin-inline-start:8px}
.how summary{cursor:pointer;font-size:14px;color:var(--lap);min-height:40px;display:flex;align-items:center}
.how .lg{margin:10px 0 2px;font-weight:600;font-size:14px}
.sch{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:2px 12px;font-size:14px}
.sch b{font:400 18px var(--lex);margin-inline-start:4px}
.stat{color:var(--mut);margin:6px 0 4px;font-size:13px}
.res{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.res li{border-bottom:1px solid var(--line)}
.res li.inb{background:var(--card);border-radius:12px;border-bottom:0;margin:6px 0;padding:0 12px}
span.mo{color:light-dark(#7d828b,#8f959f)}
li.sep{border:0;margin:22px 0 4px;font:600 14px 'Noto Sans',sans-serif;color:color-mix(in srgb,var(--rub) 70%,var(--bg));letter-spacing:.01em}
mark.hl{background:none;color:inherit;box-shadow:inset 0 -.5em 0 light-dark(#ffe45c,#8a7200);border-radius:2px}
.hit{padding:14px 2px}
.hd{display:flex;flex-wrap:nowrap;align-items:flex-start;gap:6px}.hlf{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 4px}.hlf .hw{min-width:0;overflow-wrap:anywhere}.hb{flex:none;display:inline-flex;align-items:center;gap:2px;margin-inline-start:auto;min-height:29px}
:root{--trg:light-dark(#2e7d4f,#86d6a2)}
.tv{display:none}body[data-trm=la] .tla,body[data-trm=ru] .tru,body[data-trm=both] .tbo{display:block}
.pla+.pru{margin-top:3px}.pru{color:var(--trg);margin-inline-start:1.25em;padding-inline-end:10px;border-inline-end:2px solid var(--trg);margin-bottom:8px}
.tru .pru{margin-inline-start:0;margin-bottom:0}
.pru .ex,.pru .l.x .ex{color:color-mix(in srgb,var(--trg) 68%,var(--bg))}
.trb{margin-inline-start:auto;min-height:32px;padding:0 10px;background:none;border:1px solid var(--trg);border-radius:8px;color:var(--mut);font:400 13px 'Noto Sans',sans-serif;cursor:pointer}
body[data-trm=la] .trb .a,body[data-trm=ru] .trb .b,body[data-trm=both] .trb .a,body[data-trm=both] .trb .b{color:var(--trg);font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.trb+.cp{margin-inline-start:8px}

.lw{cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--lap) 55%,transparent);text-underline-offset:3px}
.lw:hover{color:var(--lap)}body[data-trm=both] .tbo .lw{text-decoration:none}
.pop{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgb(0 0 0/.18);max-height:33.3vh;max-height:33.3dvh;overflow:auto;padding:14px max(5vw,16px) 22px;border-radius:16px 16px 0 0}

.lt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font:600 13px 'Noto Sans',sans-serif;color:var(--mut);margin:4px 0 8px}

.ex{color:light-dark(#7d828b,#8f959f)}

    setSync('Сохраняю «'+d.name+'» в аккаунт…');
    const chunks=[];let cur=[],sz=0;
    for(const e of d.entries){const l=(e[0].length+(e[1]||'').length+8)*3;if(sz+l>200000&&cur.length){chunks.push(cur);cur=[];sz=0}cur.push([e[0],e[1]||'']);sz+=l}
    if(cur.length)chunks.push(cur);
    for(let i=0;i<chunks.length;i++)await cloud.col.doc('c_'+d.id+'_'+i).set({e:chunks[i]});
    cloud.list=cloud.list.filter(m=>m.id!==d.id).concat({id:d.id,name:d.name,lang:d.lang,count:d.entries.length,chunks:chunks.length,created:d.created});

  }catch(e){setSync(e&&e.code==='quota_exceeded'?'Место в аккаунте закончилось: «'+d.name+'» сохранён только в этом браузере.':'Не удалось сохранить «'+d.name+'» в аккаунт; он есть в этом браузере.')}
}

function decode(buf,enc){
  const u=new Uint8Array(buf);
  if(enc==='auto'){
    if(u[0]===0xFF&&u[1]===0xFE)enc='utf-16le';else if(u[0]===0xFE&&u[1]===0xFF)enc='utf-16be';
    else{try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){enc='windows-1251'}}

  return new TextDecoder(enc).decode(buf);
}
function parseCSV(t,d){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==='')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
const SEPS=[['\t','Табуляция'],[';','Точка с запятой'],[',','Запятая'],['|','Черта |'],[' — ','Тире —'],[' – ','Тире –'],[' - ','Дефис с пробелами'],[' = ','Знак ='],[': ','Двоеточие'],['ws','Первый пробел']];

const sval=v=>v==null?'':Array.isArray(v)?v.map(sval).join('; '):typeof v==='object'?JSON.stringify(v):String(v);
function fromJSON(j){

    const ks=[];for(const o of j.slice(0,300))for(const k of Object.keys(o||{}))if(!ks.includes(k))ks.push(k);

  }

function dslClean(l,h){return l.replace(/\{\{.*?\}\}/g,'').replace(/\[s\].*?\[\/s\]/g,'').replace(/(?<!\\)\[[^\]]*\]/g,'').replace(/<<|>>/g,'').replace(/(?<!\\)~/g,()=>h).replace(/\\(.)/g,'$1').replace(/[ \t]+/g,' ').trim()}
function fromDSL(t){

  const flush=()=>{for(const h of hws)raw.push([h,body.map(l=>dslClean(l,h)).filter(Boolean).join('\n')])};
  for(const line of t.split(/\r?\n/)){
    if(line.startsWith('#')){const m=line.match(/^#NAME\s+"(.*)"/);if(m)title=m[1];continue}
    if(!line.trim())continue;

function parse(txt,name,sep){
  name=name.replace(/\.dz$/i,'');

  if(ext==='dsl'||/^#(NAME|INDEX_LANGUAGE)/.test(t))return fromDSL(txt);
  if(ext==='json'||/^[\[{]/.test(t)){try{const r=fromJSON(JSON.parse(txt));if(r)return r}catch(e){}}

  return fromDelim(txt,sep);

$('#kb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){kbLang=b.dataset.k;gezBase=null;LS.set('kb',kbLang);renderKb();return}
  if(b.dataset.g){const x=b.dataset.g.charCodeAt(0);if(gezBase===x)insert(b.dataset.g);gezBase=x;renderKb();return}
  if(b.dataset.bs){backspace();return}
  if(b.dataset.c!=null)insert(b.dataset.c);
});
$('#dl').addEventListener('change',e=>{const t=e.target.dataset.t;if(!t)return;e.target.checked?off.delete(t):off.add(t);LS.set('off',[...off]);renderLgb();search()});
$('#lgb').addEventListener('click',e=>{const b=e.target.closest('button[data-g]');if(!b)return;const ids=dicts.filter(d=>d.lang===b.dataset.g).map(d=>d.id),on=ids.some(id=>!off.has(id));ids.forEach(id=>on?off.add(id):off.delete(id));LS.set('off',[...off]);refresh();if(!$('#kb').hidden)kbAuto()});
$('#dl').addEventListener('click',async e=>{const b=e.target.closest('.del');if(!b)return;
  if(!b.classList.contains('sure')){b.classList.add('sure');b.textContent='Точно?';setTimeout(()=>{b.classList.remove('sure');b.textContent='Удалить'},3000);return}
  const id=b.dataset.x,d0=dicts.find(d=>d.id===id);dicts=dicts.filter(d=>d.id!==id);await idb.del(id);if(d0&&d0.demo)LS.set('gone',[...LS.get('gone',[]),id]);else unload(id);
  off.delete(id);LS.set('off',[...off]);refresh();toast('Словарь удалён')});
document.querySelectorAll('[data-o]').forEach(c=>{c.checked=!!opt[c.dataset.o];c.addEventListener('change',()=>{opt[c.dataset.o]=c.checked;LS.set('opt',opt);dicts.forEach(d=>{d.hk=d.dk=d.sk=null});search()})});
$('#ov').addEventListener('change',e=>{const t=e.target;
  if(t.id==='iE'){cur.enc=t.value;cur.dname=$('#iN').value;reparse(true);renderDlg()}
  else if(t.id==='iS'){cur.sep=t.value;cur.dname=$('#iN').value;reparse(true);renderDlg()}
  else if(t.id==='iH'){cur.p.header=t.checked;cur.dname=$('#iN').value;renderDlg()}
  else if(t.id==='iW'){cur.hw=+t.value;cur.def.delete(cur.hw);cur.dname=$('#iN').value;cur.lang=$('#iL').value;renderDlg()}
  else if(t.id==='iL'){cur.lang=t.value}
  else if(t.dataset.c!=null){t.checked?cur.def.add(+t.dataset.c):cur.def.delete(+t.dataset.c)}
});
$('#ov').addEventListener('click',e=>{if(e.target.id==='iOK'){e.target.disabled=true;doImport()}else if(e.target.id==='iX')nextFile()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)nextFile()});
/* ---------- start ---------- */
(async()=>{
  await idb.open();
  dicts=((await idb.all())||[]).sort((a,b)=>a.created-b.created);
  applyLang();$('#uil').addEventListener('change',e=>{UIL=e.target.value;LS.set('ui',UIL);applyLang();renderTrSec();refresh();laIdx=null;loadBuiltins().then(()=>{setSync('');refresh()})});
  renderTrSec();$('#trsec').addEventListener('change',e=>{const L=e.target.dataset.tl;if(!L)return;trCfg[L]=e.target.value;LS.set('trcfg',trCfg);renderTrSec();applyLang();search()});
  refresh();
  await loadBuiltins();setSync('');
  try{LATF=await (await fetch('data/latforms.json',FRESH?{cache:'reload'}:{})).json();search()}catch(e){}
  if(FRESH)try{history.replaceState(null,'',location.pathname)}catch(e){}
})();
}
</script>
<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
</body>
</html>
